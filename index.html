<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F3D3E" />
    <title>Integra-Tracker</title>
    <link rel="icon" type="image/svg+xml" href="./brand/icone-AR-quadrado.svg" />
    <link rel="apple-touch-icon" href="./brand/icone-AR-quadrado.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gloock&family=Schibsted+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema escolhido antes de desenhar a página (evita um clarão).
      try {
        var t = localStorage.getItem('integra-tracker:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
